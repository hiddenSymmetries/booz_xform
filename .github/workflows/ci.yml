# This file is based on examples in
# https://docs.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on: [push, pull_request]

jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    # First print out lots of information. We do this in separate 
    # "name" blocks because otherwise the output gets mixed together
    # in the github actions log.

    - name: Print user and group id
      run: id

    - name: PWD
      run: pwd

    - name: apt-get any needed packages
      if: "contains(matrix.os, 'ubuntu')"
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake libnetcdf-dev

    - name: get any needed packages from homebrew
      if: "contains(matrix.os, 'macos')"
      run: |
        brew install netcdf libomp
        # CMake does not search Homebrew's prefix by default on Apple Silicon,
        # so tell cmake/FindNetCDF.cmake where to look. libomp is what lets
        # find_package(OpenMP) succeed with Apple clang.
        echo "NETCDF_DIR=$(brew --prefix)" >> $GITHUB_ENV

    - name: Print versions
      run: |
        cmake --version

    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: which python after python setup
      run: python --version

    - name: Update pip
      run: |
        python -m pip install --upgrade pip
    
    #- name: Install required python packages
    #  run: |
    #    pip install wheel numpy jax jaxlib
    
    - name: env after adding python
      run: env

    # The [test] extra adds pytest, scipy and matplotlib, which the test suite
    # needs but the package itself does not.
    #
    # BOOZ_XFORM_REQUIRE_OPENMP makes a build that cannot find OpenMP fail here
    # rather than quietly producing a serial build. That is exactly how the
    # macOS wheels lost their parallelism once: Homebrew's libomp is keg-only,
    # so FindOpenMP came up empty and the build carried on happily.
    - name: Install
      run: pip install -v ".[test]"
      env:
        CMAKE_ARGS: -DBOOZ_XFORM_REQUIRE_OPENMP=ON

    - name: Try import
      run: |
        python -c "
        import booz_xform as bx
        b = bx.Booz_xform()
        print('version:', bx.__version__)
        print('OpenMP max threads:', bx.omp_max_threads())
        assert bx.omp_max_threads() > 1, 'built without OpenMP, or runner has 1 core'
        "

    - name: Try the command-line driver
      run: xbooz_xform | head -1

    - name: Run python unit tests
      run: python -m pytest -v
      env:
        MPLBACKEND: Agg

    # To run the C++ unit tests, it seems best to build them separately from the python package system, because we don't want these unit tests to be installed. It seems unnecessary to build them again, but the little bit of time this takes is not important.

    - name: Install python packages required for standalone build
      run: pip install pybind11

    - name: Configure CMake
      run: |
        if [ -d build ]; then rm -rf build; fi
        mkdir build
        cd build
        cmake ..

    - name: Build C++ unit tests
      run: |
        cd build
        make -j unitTests

    - name: Run C++ unit tests
      run: |
        cd build
        ./unitTests
